<!DOCTYPE html>
<html>
<head>
<title>Edit Transaction</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(120deg,#4facfe,#00f2fe);
}

/* Container */
.container{
    background: white;
    padding: 40px;
    width: 380px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    text-align: center;
}

/* Heading */
h2{
    margin-bottom: 25px;
    color: #2c3e50;
}

/* Labels */
label{
    display: block;
    text-align: left;
    margin-top: 15px;
    font-weight: bold;
    color: #333;
}

/* Inputs */
input{
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    transition: 0.3s;
}

input:focus{
    border-color: #3498db;
    outline: none;
    box-shadow: 0 0 6px rgba(52,152,219,0.5);
}

/* Button */
button{
    margin-top: 25px;
    width: 100%;
    padding: 12px;
    border: none;
    background: #2c3e50;
    color: white;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover{
    background: #1a252f;
    transform: scale(1.03);
}

/* Back link */
.back{
    display: block;
    margin-top: 15px;
    text-decoration: none;
    color: #2c3e50;
    font-weight: bold;
}

.back:hover{
    text-decoration: underline;
}

</style>

</head>

<body>

<div class="container">

<h2>Edit Transaction</h2>

<form method="POST">

<label>Description</label>
<input type="text" name="description" value="{{data[2]}}" required>

<label>Amount</label>
<input type="number" name="amount" value="{{data[3]}}" required>

<button type="submit">Update</button>

</form>

<a class="back" href="/dashboard">← Back to Dashboard</a>

</div>

</body>
</html>
