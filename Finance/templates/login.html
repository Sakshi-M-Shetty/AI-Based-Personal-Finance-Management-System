<!DOCTYPE html>

<html>

<head>
<title>AI-Based Personal Finance Management System</title>

<style>

/* BODY WITH BACKGROUND IMAGE */

body{
font-family:"Segoe UI", Arial, sans-serif;
margin:0;
height:100vh;

background-image:url("/static/images/bg.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;

display:flex;
flex-direction:column;
}

/* HEADER */

.header{
background:rgba(0,0,0,0.6);
color:white;
text-align:center;
padding:20px;
font-size:30px;
font-weight:bold;
letter-spacing:1px;
}

/* CENTER LOGIN */

.container{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

/* GLASS LOGIN CARD */

.form-box{

background:rgba(255,255,255,0.9);
backdrop-filter:blur(8px);

padding:50px;
width:420px;

border-radius:12px;

box-shadow:0 12px 35px rgba(0,0,0,0.3);

text-align:center;
}

/* TITLE */

h2{
margin-bottom:25px;
color:#2c3e50;
font-size:28px;
}

/* INPUT FIELDS */

input{
width:100%;
padding:14px;
margin:12px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

input:focus{
border-color:#3498db;
outline:none;
box-shadow:0 0 5px rgba(52,152,219,0.6);
}

/* BUTTON */

button{
width:100%;
padding:14px;

background:#2c3e50;
color:white;

border:none;
border-radius:8px;

font-size:18px;
cursor:pointer;

transition:0.3s;
}

button:hover{
background:#1a252f;
transform:scale(1.02);
}

/* LINK */

a{
text-decoration:none;
color:#3498db;
font-weight:bold;
font-size:16px;
}

p{
margin-top:20px;
font-size:16px;
}

</style>

</head>

<body>

<div class="header">
AI-Based Personal Finance Management System
</div>

<div class="container">

<div class="form-box">

<h2>User Login</h2>

<form method="POST" action="/login">

<input type="email" name="email" placeholder="Enter Email Address" required>

<input type="password" name="password" placeholder="Enter Password" required>

<button type="submit">Login</button>
</form>

<p>
Don't have an account? <a href="/register">Register</a>
</p>

</div>

</div>

</body>

</html>
